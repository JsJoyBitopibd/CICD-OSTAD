# ---------------------------------------------------------------
# service.yaml
# Pods get a new IP every time they restart, so nothing should ever
# talk to a pod IP directly. A Service is a stable name and IP that
# load-balances across every pod carrying the selector's labels.
#
# type: NodePort opens the same port on the node itself, which is how
# the outside world reaches the app without an AWS LoadBalancer.
# ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: cicd-ostad-svc
  namespace: production
  labels:
    app: cicd-ostad
spec:
  type: NodePort
  selector:
    app: cicd-ostad                # picks up every pod with this label
  ports:
    - name: http
      protocol: TCP
      port: 80                     # the Service's own port (inside the cluster)
      targetPort: 4000             # the container's port
      nodePort: 30080              # the port opened on the EC2's public IP
